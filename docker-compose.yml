version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vyaparsetu
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d vyaparsetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://demo_user:demo_password@postgres:5432/vyaparsetu
      JWT_SECRET: demo-only-replace-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      APP_ENV: demo
      CORS_ORIGINS: http://localhost:5173
      DEMO_VULN_BOLA: "true"
      DEMO_VULN_SQLI: "true"
      DEMO_VULN_XSS: "true"
      DEMO_VULN_ADMIN_AUTH: "true"
      DEMO_VULN_DATA_EXPOSURE: "true"
      DEMO_VULN_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
